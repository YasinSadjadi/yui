name: Build Angular package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and pack yui
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular package
        run: npm run build

      - name: Validate package archive
        run: npm run pack:dry-run

      - name: Save package artifact
        uses: actions/upload-artifact@v4
        with:
          name: yui-angular-package
          path: dist/yui/
          if-no-files-found: error
          retention-days: 14
