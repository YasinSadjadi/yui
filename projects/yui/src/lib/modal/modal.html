@if (show()) {
    <div
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/55 p-4 backdrop-blur-[2px] transition-colors duration-200"
        animate.enter="fade-in"
        animate.leave="opacity-0!"
        (animate.leave)="onModalCleanup()"
    >
        <dialog
            [open]="show()"
            class="relative m-0 w-[min(32rem,calc(100vw-2rem))] overflow-hidden rounded-xl border border-skin-darker bg-skin p-0 text-dark shadow-2xl shadow-black/30"
        >
            <header
                class="relative flex min-h-14 items-center border-b border-skin-darker bg-skin-dark/70 px-5 py-3 text-dark"
            >
                <h3 class="flex-1 text-sm font-semibold">{{ modalData()?.title }}</h3>
                <button
                    type="button"
                    [attr.aria-label]="i18n.messages().closeModal"
                    class="ms-3 flex h-8 w-8 items-center justify-center rounded-lg text-semi-dark transition hover:bg-skin-darker/50 hover:text-dark focus:outline-none focus:ring-2 focus:ring-accent/40 active:scale-95"
                    (click)="onModalClose()"
                >
                    <i class="bx bx-x text-xl" aria-hidden="true"></i>
                </button >
            </header >

            <div class="p-5">
                <ng-container *ngTemplateOutlet="modalData()?.template" ></ng-container >
            </div >
        </dialog >
    </div >

}
