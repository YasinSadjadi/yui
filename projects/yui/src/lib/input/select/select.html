<div class="w-full h-full pt-6" >
    <tasker-input-label [inputId]="confirmedId()" [title]="title()" class="w-full h-full"
                        [isDisabled]="disabledState()" >
        <div (click)="toggleDropdown()" class="relative" >
            <button
                [attr.aria-expanded]="isOpen()"
                [id]="confirmedId()"
                [disabled]="disabledState()"
                class="border-2 p-2 rounded-md border-skin-darker outline-none duration-150 bg-transparent w-full h-full relative placeholder:text-skin-darker text-left flex justify-between items-center disabled:opacity-50 disabled:cursor-not-allowed"
                type="button"
            >
                <span class="min-h-3" >{{ selectedValue()?.title }}</span >

                <i
                    [class.-rotate-90]="isOpen()"
                    class="bx bxs-chevron-left text-lg text-dark transition duration-200"
                ></i >
            </button >

            <div
                (click)="onOptionClick($event)"
                [ngClass]="{
          'opacity-0 scale-y-0': !isOpen(),
          'opacity-100 scale-y-100': isOpen(),
        }"
                class="absolute left-0 right-0 mt-1 bg-skin border border-skin-darker rounded-lg shadow-lg z-30 transition-all duration-150 ease-in-out transform origin-top"
            >
                <ul >
                    @for (option of items(); track option.value) {
                        <li
                            [attr.data-value]="option.value"
                            class="px-4 py-2 hover:bg-accent hover:text-skin active:bg-accent active:text-skin cursor-pointer border-b border-skin-darker last:border-b-0 last:rounded-b-lg first:rounded-t-lg transition-all duration-150"
                        >
                            {{ option.title }}
                        </li >
                    }
                </ul >
            </div >
        </div >
    </tasker-input-label >
</div >
