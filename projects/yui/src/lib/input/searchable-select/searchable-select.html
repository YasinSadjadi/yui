<div class="pt-6 w-full h-full" >
    <tasker-input-label [inputId]="confirmedId()" [title]="title()" class="h-full w-full text-dark"
                        [isDisabled]="disabled()" >
        <div (click)="toggleDropdown()" class="relative w-full h-full" >
            <div class="w-full h-full flex border-2 border-skin-darker rounded-md" >
                <input #searchTermInput (input)="onSearchTermChange()" [id]="confirmedId()" [value]="inputString()"
                       [disabled]="disabled()"
                       class="border-skin-darker h-full flex-1 outline-none p-2 placeholder:text-skin-darker disabled:opacity-50 disabled:cursor-not-allowed" />
                <button
                    [attr.aria-expanded]="isOpen()"
                    [id]="confirmedId() + 'Btn'"
                    class="p-2 border-skin-darker outline-none duration-150 bg-transparent h-full relative text-left flex justify-between items-center disabled:opacity-50 disabled:cursor-not-allowed"
                    type="button"
                >
                    <i
                        [class.-rotate-90]="isOpen()"
                        class="bx bxs-chevron-left text-lg text-dark transition duration-200"
                    ></i >
                </button >
            </div >

            <div
                (click)="onOptionClick($event)"
                [ngClass]="{
                    'opacity-0 scale-y-0': !isOpen(),
                    'opacity-100 scale-y-100': isOpen(),
                    }"
                class="absolute left-0 right-0 mt-1 bg-skin border border-skin-darker rounded-lg shadow-lg z-30
                 transition-all duration-150 ease-in-out transform origin-top"
            >
                @if (isLoading()) {
                    <tasker-loading class="w-full h-full" type="simple" />
                } @else {
                    @if (showItems().length == 0) {
                        <p class="text-lg text-semi-dark text-center py-5" >Nothing to show</p >
                    } @else {
                        <ul >
                            @for (option of showItems(); track $index) {
                                <li
                                    [attr.data-value]="option.value"
                                    class="px-4 py-2 hover:bg-accent hover:text-skin active:bg-accent active:text-skin cursor-pointer border-b border-skin-darker last:border-b-0 last:rounded-b-lg first:rounded-t-lg transition-all duration-150"
                                >
                                    {{ option.title }}
                                </li >
                            }
                        </ul >
                    }
                }
            </div >
        </div >
    </tasker-input-label >
</div >
