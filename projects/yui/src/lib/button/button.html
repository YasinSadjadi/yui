<button
    class="w-full min-w-4 min-h-2 px-2 py-1 border rounded-lg cursor-pointer transition ease-in-out duration-150 hover:shadow-[0_0_4px_0_rgba(0,0,0,0.4)] disabled:opacity-50 disabled:cursor-not-allowed"
    [disabled]="waiting() || disabled()"
    (click)="click.emit()"
    [ngClass]="{
    'primary-button': type() === 'primary',
    'submit-button': type() === 'submit',
    'reset-button': type() === 'reset',
    'trash-button': type() === 'delete',
    'add-button': type() === 'add',
    }"
    [type]="buttonElementType()"
>
    <div
        class="flex flex-row justify-center items-center"
        [ngClass]="{ 'justify-between gap-1': title() && icon() }"
    >
        @if (waiting()) {
            <tasker-loading class="w-full h-full" ></tasker-loading >
        } @else {
            <i class="bx {{ icon() }}" [ngClass]="{
              'text-sm': iconSize() === 'sm',
              'text-base': iconSize() === 'base',
              'text-lg': iconSize() === 'lg',
              'text-xl': iconSize() === 'xl',
              'text-2xl': iconSize() === '2xl'
            }"></i >
            <span >{{ title() }}</span >
        }
    </div >
</button >
